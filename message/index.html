<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css"/>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="./script.js" defer></script>
    <title>Document</title>

</head>
<body>
    <div class="container">
        <div class="message">
            <h3 style="text-align: center; font-weight: bold;">Pass the message</h3>
            <p style="border: 2px solid rgba(211, 211, 211, 0.5);"></p>
            <p>
                <label for="message-input">Enter a message</label>
                <br/>
                <button style="border-radius: 5px 0px 0px 5px;"><i class="far fa-envelope"></i></button><input type="text" id="message-input"/>
            </p>
            <p>
            <button onclick="getMessage()">Submit</button>
            </p>
            <p id="message-output" style="text-transform: uppercase; text-align: center;"></p>
        </div>
    </div>
    
</body>
</html>
