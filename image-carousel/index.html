<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css"/>
    <link rel="stylesheet" href="    https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css
"/>
    <script src="./script.js" defer></script>
    <title>images slideshow</title>
</head>
</head>
<body>
   
    <div class="container">
      
        <div  class="image fade">
            <img src="./img/1.jpg" alt="random image" width="100%"/>
        </div>
        <div class="image fade">
            <img src="./img/2.jpg" alt="random image" width="100%"/>
        </div>
        <div class="image fade">
            <img src="./img/3.jpg" alt="random image" width="100%"/>
        </div>
        <div class="image fade">
            <img src="./img/4.jpg" alt="random image" width="100%"/>
        </div>
        <div class="image fade">
            <img src="./img/11.jpg" alt="random image" width="100%"/>
        </div>
        <div class="image fade">
            <img src="./img/6.jpg" alt="random image" width="100%"/>
        </div>
        <div class="image fade">
            <img src="./img/7.jpg" alt="random image" width="100%"/>
        </div>
        <div class="image fade">
            <img src="./img/9.jpg" alt="random image" width="100%"/>
        </div>


        <i id="prev" onclick="show_image(-1)" class="fa-solid fa-chevron-left"></i>
        <i id="next" onclick="show_image(1)" class="fa-solid fa-chevron-right"></i>
        <div class="dots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>
    
</body>
</html>
